<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>图集捕手 · 页面图库</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body class="viewer">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="14" height="12" rx="3" />
            <path d="M7 21h10a3 3 0 0 0 3-3V8" />
            <circle cx="8" cy="9" r="1.4" />
            <path d="m4.5 15 3.8-3.4a2 2 0 0 1 2.7.1L16 16" />
          </svg>
        </span>
        <div class="brand-copy">
          <div class="brand-row">
            <span class="title">页面图库</span>
            <span class="chip" id="count">0</span>
          </div>
          <div class="page-row">
            <svg class="page-ico" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M3.5 12h17M12 3.2c2.4 2.5 3.7 5.5 3.7 8.8S14.4 18.3 12 20.8M12 3.2C9.6 5.7 8.3 8.7 8.3 12s1.3 6.3 3.7 8.8" />
            </svg>
            <span class="hint" id="pageInfo"></span>
          </div>
        </div>
      </div>

      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="theme" title="切换浅色 / 深色主题" aria-label="切换主题">
          <svg viewBox="0 0 24 24" id="themeIcon"></svg>
        </button>
        <button type="button" class="icon-btn" id="rescan" title="重新扫描来源页面" aria-label="重新扫描">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
        <button type="button" class="icon-btn" id="options" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5zm7.4-3.5a7.5 7.5 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2-1.2L14.5 3h-5l-.4 2.6a7.6 7.6 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2 1.2L9.5 21h5l.4-2.6a7.6 7.6 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6a7.5 7.5 0 0 0 .1-1.2z"/></svg>
        </button>
      </div>
    </header>

    <section class="filters" aria-label="搜索与筛选">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" />
          <path d="m16 16 4 4" />
        </svg>
        <input type="text" id="q" placeholder="搜索文件名、地址或 alt…" autocomplete="off" spellcheck="false" aria-label="搜索图片" />
      </div>

      <div class="select-wrap">
        <select id="minSize" aria-label="尺寸筛选">
          <option value="0">全部尺寸</option>
          <option value="120" selected>≥ 120px</option>
          <option value="300">≥ 300px</option>
          <option value="800">≥ 800px</option>
          <option value="1600">≥ 1600px</option>
        </select>
      </div>

      <div class="select-wrap">
        <select id="typeFilter" aria-label="类型筛选">
          <option value="all">全部类型</option>
          <option value="photo">普通图片</option>
          <option value="gif">GIF 动图</option>
          <option value="css">背景图</option>
          <option value="visual">Canvas / 视频</option>
          <option value="vector">内联 SVG</option>
        </select>
      </div>

      <div class="select-wrap">
        <select id="sort" aria-label="排序方式">
          <option value="area">按面积排序</option>
          <option value="w">按宽度排序</option>
          <option value="kind">按类型排序</option>
        </select>
      </div>
    </section>

    <section class="quickbar" aria-label="批量选择与显示设置">
      <div class="select-links">
        <button type="button" class="link-btn" id="selAll">全选</button>
        <button type="button" class="link-btn" id="selNone">清空</button>
        <button type="button" class="link-btn" id="selInvert">反选</button>
        <span class="link-sep" aria-hidden="true"></span>
        <button type="button" class="link-btn" id="selBig">仅选大图 ≥800</button>
        <span class="link-sep" aria-hidden="true"></span>
        <button type="button" class="link-btn" id="openSrc">打开来源页面</button>
      </div>

      <div class="quick-right">
        <label class="switch-chip compact">
          <input type="checkbox" id="susp" />
          <span class="switch" aria-hidden="true"></span>
          <span>疑似</span>
        </label>
        <label class="switch-chip compact" title="隐藏预览加载失败的图片">
          <input type="checkbox" id="hideBroken" />
          <span class="switch" aria-hidden="true"></span>
          <span>隐藏失效</span>
        </label>
        <label class="sizer" title="调整缩略图显示大小（只影响视图，不重新加载图片）">
          <span class="sizer-label">显示</span>
          <input type="range" id="thumbSize" min="72" max="260" step="4" value="116" aria-label="缩略图大小" />
          <span class="sizer-val" id="thumbSizeVal">116</span>
        </label>
      </div>
    </section>

    <main id="grid" class="grid" aria-label="图片列表"></main>

    <div class="empty" id="empty" hidden>
      <div class="empty-visual" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <circle cx="8.5" cy="9.5" r="1.6" />
          <path d="m4 17 4.8-4.4a2 2 0 0 1 2.7 0L17 18M15 14.5l1.4-1.3a2 2 0 0 1 2.7 0L21 15" />
        </svg>
      </div>
      <p id="emptyText">没有图片。</p>
    </div>

    <footer class="bottombar">
      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-copy">
          <span class="progress-label">正在处理</span>
          <span id="progressText">0/0</span>
        </div>
        <div class="progress"><div class="progress-inner" id="progressBar"></div></div>
      </div>

      <div class="footer-main">
        <span class="stat" id="stat">已选 0 张 · 共 0 张</span>
        <div class="footer-actions">
          <button type="button" class="btn ghost" id="zip" title="把选中的图片打包成一个 ZIP">
            <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H10l2 2h5.5A2.5 2.5 0 0 1 20 9.5v7A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5zM12 11v5m0 0-2-2m2 2 2-2" /></svg>
            <span>打包 ZIP</span>
          </button>
          <button type="button" class="btn ghost" id="dlAll">
            <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m0 0-3.5-3.5M12 14l3.5-3.5M5 17.5V19h14v-1.5" /></svg>
            <span>全部下载</span>
          </button>
          <button type="button" class="btn primary" id="dlSel" disabled>
            <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m0 0-3.5-3.5M12 14l3.5-3.5M5 17.5V19h14v-1.5" /></svg>
            <span id="dlSelLabel">下载选中</span>
          </button>
        </div>
      </div>
    </footer>

    <div class="toast" id="toast" hidden></div>
    <script src="viewer.js"></script>
  </body>
</html>
